<div id="dropdown-motion" class="viz-carousel viz-dotted-background" aria-label="Dropdown animation variations">
  <section data-variant="Cascading rows" aria-label="Cascading rows"></section>
  <section data-variant="Moving highlight" aria-label="Moving highlight" hidden></section>
  <section data-variant="Icon feedback" aria-label="Icon feedback" hidden></section>
  <section data-variant="Sliding submenu" aria-label="Sliding submenu" hidden></section>
</div>
<style>
  #dropdown-motion { --dm-ink: light-dark(#25272b,#eeeef0); --dm-sub: light-dark(#686b73,#a1a3ac); --dm-paper: light-dark(#fff,#242529); --dm-edge: light-dark(#e2e3e7,#3d3e44); --dm-hover: light-dark(#edeef2,#383a43); --dm-shadow: light-dark(#20202b18,#00000040); --dm-ease: cubic-bezier(.23,1,.32,1); color:var(--dm-ink); font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  #dropdown-motion * { box-sizing:border-box; }
  #dropdown-motion .dm-stage { height:438px; padding:28px 18px 16px; display:flex; flex-direction:column; align-items:center; }
  #dropdown-motion .dm-caption { margin:0 0 22px; color:var(--dm-sub); font-size:12px; align-self:flex-start; max-width:calc(100% - 80px); }
  #dropdown-motion .dm-anchor { width:264px; max-width:100%; }
  #dropdown-motion button { font:inherit; color:inherit; }
  #dropdown-motion .dm-trigger { display:flex; align-items:center; gap:10px; border:1px solid var(--dm-edge); border-radius:9px; background:var(--dm-paper); padding:10px 14px; box-shadow:0 2px 5px var(--dm-shadow); }
  #dropdown-motion .dm-trigger svg:last-child { margin-left:14px; transition:transform 160ms var(--dm-ease); }
  #dropdown-motion .dm-trigger[aria-expanded="true"] svg:last-child { transform:rotate(180deg); }
  #dropdown-motion .dm-menu { margin-top:9px; padding:7px; background:var(--dm-paper); border:1px solid var(--dm-edge); border-radius:12px; box-shadow:0 12px 32px var(--dm-shadow),0 2px 6px var(--dm-shadow); transform-origin:top left; opacity:1; transform:scale(1); transition:opacity 180ms var(--dm-ease),transform 180ms var(--dm-ease); }
  #dropdown-motion .dm-menu.dm-closed { opacity:0; transform:scale(.96); pointer-events:none; }
  #dropdown-motion .dm-label { padding:8px 10px 9px; color:var(--dm-sub); font-size:12px; }
  #dropdown-motion .dm-list { position:relative; }
  #dropdown-motion .dm-row { position:relative; display:flex; align-items:center; width:100%; height:42px; gap:11px; padding:0 10px; border:0; border-radius:6px; background:transparent; text-align:left; transition:background-color 140ms ease,opacity 180ms var(--dm-ease),transform 180ms var(--dm-ease); }
  #dropdown-motion .dm-row svg { width:17px; height:17px; flex-shrink:0; color:var(--dm-sub); }
  #dropdown-motion .dm-row .dm-end { margin-left:auto; color:var(--dm-sub); font-size:12px; }
  #dropdown-motion .dm-divider { height:1px; background:var(--dm-edge); margin:5px 8px; }
  #dropdown-motion .dm-highlight { position:absolute; left:0; top:0; width:100%; height:42px; border-radius:6px; background:var(--dm-hover); opacity:0; transition:transform 180ms var(--dm-ease),opacity 125ms ease; pointer-events:none; }
  #dropdown-motion .dm-cascade.dm-closed .dm-row { opacity:0; transform:translateY(-6px); transition-delay:0ms !important; }
  #dropdown-motion .dm-status { min-height:20px; margin-top:18px; color:var(--dm-sub); font-size:12px; }
  #dropdown-motion .dm-icon { display:flex; align-items:center; }
  #dropdown-motion .dm-icon-active { color:light-dark(#35654c,#9cceb0) !important; }
  #dropdown-motion .dm-viewport { overflow:hidden; }
  #dropdown-motion .dm-track { display:flex; width:200%; transform:translateX(0); transition:transform 220ms var(--dm-ease); }
  #dropdown-motion .dm-track.dm-detail { transform:translateX(-50%); }
  #dropdown-motion .dm-page { width:50%; flex-shrink:0; }
  @media (hover:hover) and (pointer:fine) { #dropdown-motion .dm-row:hover { background:var(--dm-hover); } #dropdown-motion .dm-follow .dm-row:hover { background:transparent; } }
  @media (prefers-reduced-motion:reduce) { #dropdown-motion .dm-menu,#dropdown-motion .dm-row,#dropdown-motion .dm-track,#dropdown-motion .dm-trigger svg { transition:opacity 125ms ease; transform:none !important; transition-delay:0ms !important; } #dropdown-motion .dm-track.dm-detail { transform:translateX(-50%) !important; } #dropdown-motion .dm-highlight { transition:none; } }
</style>
<script>
(() => {
  const root = document.getElementById('dropdown-motion');
  const descriptions = ['Rows settle in sequence · 35 ms stagger','A single highlight follows the pointer or keyboard focus','Pin, favorite, and copy respond inside their rows','A secondary page slides into the same menu'];
  const symbols = ['pin','star','copy','settings-2'];
  const labels = ['Pin conversation','Add to favorites','Copy link','Preferences'];
  const saved = window.openai?.widgetState?.privateContent || {};
  const state = { pinned:!!saved.pinned, favorite:!!saved.favorite };
  const save = () => window.openai?.setWidgetState({modelContent:{pinned:state.pinned,favorite:state.favorite},privateContent:state})?.catch(() => {});
  const icon = name => `<i data-lucide="${name}" aria-hidden="true"></i>`;
  root.querySelectorAll('section').forEach((section, variant) => {
    section.innerHTML = `<div class="dm-stage"><div class="dm-caption">${descriptions[variant]}</div><div class="dm-anchor"><button type="button" class="dm-trigger cursor-interaction" aria-expanded="true" aria-controls="dm-menu-${variant}">${icon('message-square')} Conversation ${icon('chevron-down')}</button><div id="dm-menu-${variant}" class="dm-menu ${variant===0?'dm-cascade':''} ${variant===1?'dm-follow':''}" aria-label="Conversation actions"><div class="dm-viewport"><div class="dm-track"><div class="dm-page"><div class="dm-label">Conversation actions</div><div class="dm-list">${variant===1?'<div class="dm-highlight"></div>':''}${labels.map((label,i)=>`<button type="button" class="dm-row cursor-interaction" data-action="${i}"><span class="dm-icon">${icon(symbols[i])}</span><span class="dm-text">${label}</span><span class="dm-end">${i===3?icon('chevron-right'):['⌘ P','⌘ D','⌘ L'][i]}</span></button>`).join('')}</div><div class="dm-divider"></div><button type="button" class="dm-row cursor-interaction" data-action="archive">${icon('archive')} Archive conversation</button></div><div class="dm-page"><button type="button" class="dm-row cursor-interaction" data-back>${icon('arrow-left')} Preferences</button><div class="dm-divider"></div><button type="button" class="dm-row cursor-interaction" data-toggle="Notifications">${icon('bell')} Notifications <span class="dm-end">On</span></button><button type="button" class="dm-row cursor-interaction" data-toggle="Sound">${icon('volume-2')} Sound <span class="dm-end">Off</span></button><button type="button" class="dm-row cursor-interaction" data-toggle="Auto archive">${icon('archive')} Auto archive <span class="dm-end">Off</span></button></div></div></div></div></div><div class="dm-status" aria-live="polite"></div></div>`;
    const menu=section.querySelector('.dm-menu'), trigger=section.querySelector('.dm-trigger'), track=section.querySelector('.dm-track'), status=section.querySelector('.dm-status');
    const pages=section.querySelectorAll('.dm-page');
    pages[1].inert=true;
    function showDetail(detail){track.classList.toggle('dm-detail',detail);pages[0].inert=detail;pages[1].inert=!detail;section.querySelector(detail?'[data-back]':'[data-action="3"]').focus({preventScroll:true});}
    let timer;
    function toggle(open, keyboard=false) {
      clearTimeout(timer);
      menu.inert=!open;
      menu.style.visibility='visible';
      menu.classList.toggle('dm-closed',!open);
      trigger.setAttribute('aria-expanded',String(open));
      section.querySelectorAll('[data-action]').forEach((row,i)=>row.style.transitionDelay=open && variant===0 && !keyboard ? `${i*35}ms`:'0ms');
      if(!open) timer=setTimeout(()=>menu.style.visibility='hidden',190);
    }
    trigger.addEventListener('click',event=>toggle(trigger.getAttribute('aria-expanded')!=='true',event.detail===0));
    section.addEventListener('keydown',event=>{if(event.key==='Escape'){toggle(false,true);trigger.focus();}});
    const highlight=section.querySelector('.dm-highlight');
    if(highlight) {
      const list=section.querySelector('.dm-list');
      const follow=row=>{highlight.style.transform=`translateY(${row.offsetTop}px)`;highlight.style.opacity='1';};
      list.querySelectorAll('button').forEach(row=>{row.addEventListener('pointerenter',()=>follow(row));row.addEventListener('focus',()=>follow(row));});
      list.addEventListener('pointerleave',()=>{highlight.style.opacity='0';});
      list.addEventListener('focusout',event=>{if(!list.contains(event.relatedTarget))highlight.style.opacity='0';});
    }
    section.querySelectorAll('[data-action]').forEach(row=>row.addEventListener('click',()=>{
      const action=row.dataset.action;
      if(action==='3'){showDetail(true);return;}
      if(action==='0'||action==='1') {
        const key=action==='0'?'pinned':'favorite';state[key]=!state[key];
        row.querySelector('.dm-text').textContent=action==='0'?(state[key]?'Unpin conversation':'Pin conversation'):(state[key]?'Remove favorite':'Add to favorites');
        const mark=row.querySelector('.dm-icon');mark.classList.toggle('dm-icon-active',state[key]);
        if(variant===2 && !matchMedia('(prefers-reduced-motion: reduce)').matches)mark.animate([{transform:'scale(1) rotate(0deg)'},{transform:'scale(1.18) rotate(-14deg)',offset:.45},{transform:'scale(1) rotate(0deg)'}],{duration:250,easing:'cubic-bezier(.23,1,.32,1)'});
        status.textContent=action==='0'?(state[key]?'Conversation pinned':'Conversation unpinned'):(state[key]?'Added to favorites':'Removed from favorites');save();
      } else if(action==='2') {
        row.querySelector('.dm-text').textContent='Copied';
        row.querySelector('.dm-icon').innerHTML=icon('check');
        globalThis.lucide?.createIcons();status.textContent='Link copied · preview';
      } else {status.textContent='Conversation archived · preview';}
    }));
    section.querySelector('[data-back]').addEventListener('click',()=>showDetail(false));
    section.querySelectorAll('[data-toggle]').forEach(button=>button.addEventListener('click',()=>{const end=button.querySelector('.dm-end');end.textContent=end.textContent==='On'?'Off':'On';status.textContent=`${button.dataset.toggle} ${end.textContent.toLowerCase()}`;}));
    const options={duration:180};
    if(globalThis.Tweak){const tweak=new Tweak({container:section,onChange:()=>{menu.style.transitionDuration=`${options.duration}ms`;}});tweak.addSlider(options,'duration',{label:'Menu duration',min:150,max:250,unit:'ms'});}
  });
  function restore(snapshot){const data=snapshot?.privateContent;if(!data)return;state.pinned=!!data.pinned;state.favorite=!!data.favorite;root.querySelectorAll('[data-action="0"] .dm-text').forEach(label=>label.textContent=state.pinned?'Unpin conversation':'Pin conversation');root.querySelectorAll('[data-action="1"] .dm-text').forEach(label=>label.textContent=state.favorite?'Remove favorite':'Add to favorites');}
  restore(window.openai?.widgetState);
  window.addEventListener('openai:set_globals',event=>restore(event.detail?.globals?.widgetState));
})();
</script>
